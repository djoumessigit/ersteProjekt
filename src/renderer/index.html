<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src 'self' blob: data:; child-src 'self' blob: data:;" />
  <title>MA'A-Bri</title>
  <link rel="icon" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Ecran d'authentification (affiche avant la zone de travail) -->
  <div id="auth-screen" class="auth-screen"></div>

  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img class="sidebar-logo" src="assets/logo.svg" alt="Logo MA'A-Bri" />
        <div class="sidebar-wordmark">
          <span class="sidebar-title">MA'A-Bri</span>
          <span class="sidebar-subtitle" data-i18n="sidebar.subtitle">Bestandsverwaltung</span>
        </div>
      </div>
      <nav>
        <button class="nav-btn active" data-page="stock" data-i18n="nav.stock">📦 Bestand</button>
        <button class="nav-btn" data-page="epice" data-i18n="nav.epice">🌿 Gewürz</button>
        <button class="nav-btn" data-page="entree" data-i18n="nav.entree">➕ Eingang</button>
        <button class="nav-btn" data-page="sortie" data-i18n="nav.sortie">➖ Ausgang</button>
        <button class="nav-btn" data-page="rapport" data-i18n="nav.rapport">📊 Bericht</button>
        <button class="nav-btn" data-page="parametres" data-i18n="nav.parametres">⚙️ Einstellungen</button>
      </nav>
    </aside>

    <main class="main-area">
      <header class="main-header">
        <div class="main-header-inner">
          <h1 id="page-title">Bestandsübersicht</h1>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <!-- i18n (doit être chargé avant les composants) -->
  <script src="js/i18n/i18n.js"></script>

  <!-- Services renderer (gestion des requetes vers le main-process) -->
  <script src="js/services/ApiClient.js"></script>

  <!-- Utilitaires -->
  <script src="js/utils/EmailHtml.js"></script>

  <!-- Authentification -->
  <script src="js/components/AuthGate.js"></script>

  <!-- Composants graphiques -->
  <script src="js/components/StockTable.js"></script>
  <script src="js/components/FormEpice.js"></script>
  <script src="js/components/FormAjout.js"></script>
  <script src="js/components/FormSortie.js"></script>
  <script src="js/components/RapportView.js"></script>
  <script src="js/components/SettingsView.js"></script>

  <!-- Orchestrateur -->
  <script src="js/app.js"></script>
</body>
</html>
