<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo MA'A-Bri">
  <defs>
    <radialGradient id="badgeGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#f3a23f"/>
      <stop offset="100%" stop-color="#c9720d"/>
    </radialGradient>
    <linearGradient id="pestleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a5636"/>
      <stop offset="100%" stop-color="#6b3f2a"/>
    </linearGradient>
  </defs>

  <!-- anneau exterieur -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#6b3f2a" stroke-width="2.5"/>

  <!-- disque principal -->
  <circle cx="50" cy="50" r="44.5" fill="url(#badgeGrad)"/>

  <!-- envolee d'epices (fleeks) -->
  <circle cx="37" cy="27" r="3.4" fill="#4c7a3d"/>
  <circle cx="49" cy="21" r="2.6" fill="#fdf6ec"/>
  <circle cx="61" cy="27.5" r="3.1" fill="#b3402c"/>
  <circle cx="43.5" cy="34" r="2" fill="#fdf6ec"/>
  <circle cx="56" cy="33.5" r="2" fill="#4c7a3d"/>

  <!-- mortier -->
  <path d="M27 55 C27 55 30 74 50 74 C70 74 73 55 73 55 Z" fill="#fdf6ec"/>
  <path d="M27 55 C27 55 30 74 50 74 C70 74 73 55 73 55" fill="none" stroke="#6b3f2a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="50" cy="55" rx="23" ry="6" fill="#fdf6ec" stroke="#6b3f2a" stroke-width="2.4"/>

  <!-- pilon -->
  <rect x="-4.5" y="-4.5" width="9" height="34" rx="4.5" fill="url(#pestleGrad)" transform="translate(58 30) rotate(28)"/>
  <ellipse cx="65.5" cy="62" rx="6.5" ry="5.2" fill="url(#pestleGrad)"/>

  <!-- grains dans le mortier -->
  <circle cx="43" cy="56" r="1.8" fill="#e08a1e"/>
  <circle cx="49" cy="58.5" r="1.8" fill="#b3402c"/>
  <circle cx="38" cy="58" r="1.5" fill="#4c7a3d"/>
</svg>
